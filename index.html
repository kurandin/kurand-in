<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurandin</title>
<meta name="description" content="Tato doména slouží pro e-mailovou komunikaci.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6b6b70; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111113; --fg:#f2f2f3; --muted:#9a9aa0; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 16px;
  }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: .02em; margin: 0 0 .75rem; }
  p { margin: 0; color: var(--muted); font-size: 1.05rem; }
</style>
</head>
<body>
  <main>
    <h1>Kurandin</h1>
    <p>Tato doména slouží pro e-mailovou komunikaci.</p>
  </main>
</body>
</html>
